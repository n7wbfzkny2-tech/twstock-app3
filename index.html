<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TWSTOCK Pro v8</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
<style>
/* ── RESET & BASE ──────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f14;--bg2:#141720;--bg3:#1c2030;--bg4:#232840;
  --border:#2a3050;--border2:#3a4570;
  --acc:#3b82f6;--acc2:#60a5fa;--acc3:#93c5fd;
  --up:#22c55e;--dn:#ef4444;--neu:#94a3b8;
  --gold:#f59e0b;--purple:#8b5cf6;--cyan:#06b6d4;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --r:12px;--r2:8px;--r3:6px;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --glow:0 0 20px rgba(59,130,246,.15);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;font-size:14px}
button{border:none;background:none;cursor:pointer;color:inherit;font:inherit}
input,select{border:none;outline:none;background:none;color:inherit;font:inherit}

/* ── LAYOUT ────────────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative;background:var(--bg)}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 80px;display:none;scroll-behavior:smooth}
.page.active{display:block}
.page::-webkit-scrollbar{width:3px}
.page::-webkit-scrollbar-track{background:transparent}
.page::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── TOP BAR ───────────────────────────────────────────────────────────── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.topbar-logo{font-size:16px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--acc),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-badge{font-size:10px;background:var(--acc);color:#fff;padding:1px 6px;border-radius:10px;font-weight:700}
.search-wrap{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);display:flex;align-items:center;padding:6px 10px;gap:6px}
.search-wrap input{flex:1;font-size:13px;background:none}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{color:var(--text3);font-size:14px}

/* ── BOTTOM NAV ────────────────────────────────────────────────────────── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(20,23,32,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:3px;color:var(--text3);transition:.2s;font-size:10px;font-weight:500}
.nav-btn.active{color:var(--acc)}
.nav-btn .nav-ico{font-size:20px;line-height:1}
.nav-btn.active .nav-ico{filter:drop-shadow(0 0 6px var(--acc))}

/* ── CARDS ─────────────────────────────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:0 12px 10px}
.card-title{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';width:3px;height:12px;background:var(--acc);border-radius:2px}

/* ── QUOTE CARD ─────────────────────────────────────────────────────────── */
.quote-hero{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px;margin-bottom:0}
.quote-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.quote-name{font-size:18px;font-weight:800}
.quote-code{font-size:13px;color:var(--text3);margin-top:2px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 1.5s infinite;box-shadow:0 0 0 0 rgba(34,197,94,.4)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live-dot.offline{background:var(--text3);animation:none}
.quote-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.quote-price{font-size:36px;font-weight:900;letter-spacing:-1px;transition:color .3s}
.quote-price.flash-up{animation:flashUp .4s}
.quote-price.flash-dn{animation:flashDn .4s}
@keyframes flashUp{0%,100%{color:inherit}50%{color:var(--up);text-shadow:0 0 20px rgba(34,197,94,.5)}}
@keyframes flashDn{0%,100%{color:inherit}50%{color:var(--dn);text-shadow:0 0 20px rgba(239,68,68,.5)}}
.quote-change{font-size:15px;font-weight:700;padding:3px 10px;border-radius:var(--r3)}
.quote-change.up{background:rgba(34,197,94,.15);color:var(--up)}
.quote-change.dn{background:rgba(239,68,68,.15);color:var(--dn)}
.quote-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.quote-meta-item{text-align:center}
.quote-meta-label{font-size:10px;color:var(--text3);margin-bottom:2px}
.quote-meta-value{font-size:13px;font-weight:600}

/* ── DAY RANGE BAR ──────────────────────────────────────────────────────── */
.range-bar-wrap{margin-top:12px}
.range-bar-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:4px}
.range-bar{height:5px;background:linear-gradient(90deg,var(--dn),var(--acc),var(--up));border-radius:3px;position:relative}
.range-bar-cursor{position:absolute;top:-3px;width:11px;height:11px;background:#fff;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 6px rgba(0,0,0,.5);transition:left .5s}

/* ── STAT GRID ──────────────────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-item{background:var(--bg3);border-radius:var(--r2);padding:10px}
.stat-label{font-size:10px;color:var(--text3);margin-bottom:3px}
.stat-value{font-size:14px;font-weight:700}

/* ── TABS ───────────────────────────────────────────────────────────────── */
.tab-bar{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;border:1px solid transparent;transition:.2s}
.tab-btn.active{background:var(--acc);color:#fff;box-shadow:0 2px 12px rgba(59,130,246,.4)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── CHART WRAP ─────────────────────────────────────────────────────────── */
.chart-wrap{padding:0 12px;margin-bottom:10px}
.chart-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;position:relative}
.chart-box canvas{border-radius:var(--r2)}

/* ── SIGNALS ─────────────────────────────────────────────────────────────── */
.signal-row{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}
.signal-row::-webkit-scrollbar{display:none}
.signal-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 12px;white-space:nowrap;font-size:12px;font-weight:600}
.signal-chip.bull{border-color:var(--up);color:var(--up);background:rgba(34,197,94,.08)}
.signal-chip.bear{border-color:var(--dn);color:var(--dn);background:rgba(239,68,68,.08)}
.signal-chip.neu{border-color:var(--text3);color:var(--text2)}

/* ── SCORE ───────────────────────────────────────────────────────────────── */
.score-circle{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:24px;border:3px solid;position:relative}
.score-circle.bull{border-color:var(--up);color:var(--up);box-shadow:0 0 20px rgba(34,197,94,.2)}
.score-circle.bear{border-color:var(--dn);color:var(--dn);box-shadow:0 0 20px rgba(239,68,68,.2)}
.score-circle.neu{border-color:var(--gold);color:var(--gold);box-shadow:0 0 20px rgba(245,158,11,.2)}
.score-label{font-size:9px;font-weight:600;letter-spacing:.5px;margin-top:-2px}

/* ── BACKTEST ─────────────────────────────────────────────────────────────── */
.bt-controls{padding:12px;display:flex;flex-direction:column;gap:10px}
.bt-row{display:flex;gap:8px}
.bt-select{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:9px 12px;font-size:13px;color:var(--text);-webkit-appearance:none;appearance:none;cursor:pointer}
.bt-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:9px 12px;font-size:13px;color:var(--text)}
.bt-input::placeholder{color:var(--text3)}
.bt-btn{padding:10px 20px;background:linear-gradient(135deg,var(--acc),var(--purple));border-radius:var(--r2);font-weight:700;font-size:14px;color:#fff;letter-spacing:.3px;box-shadow:0 4px 15px rgba(59,130,246,.3);transition:.2s;display:flex;align-items:center;gap:6px}
.bt-btn:active{transform:scale(.97)}
.bt-btn.loading{opacity:.7;pointer-events:none}

/* ── BACKTEST RESULTS ─────────────────────────────────────────────────────── */
.bt-results{padding:0 12px 10px}
.bt-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bt-kpi{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px;text-align:center}
.bt-kpi-val{font-size:22px;font-weight:900;margin-bottom:3px}
.bt-kpi-val.up{color:var(--up)}
.bt-kpi-val.dn{color:var(--dn)}
.bt-kpi-val.gold{color:var(--gold)}
.bt-kpi-val.purple{color:var(--purple)}
.bt-kpi-label{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.3px}

/* ── HEATMAP ─────────────────────────────────────────────────────────────── */
.heatmap-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:0 12px;margin-bottom:10px}
.hm-cell{aspect-ratio:1;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;cursor:pointer}
.hm-label{font-size:8px;color:rgba(255,255,255,.6);margin-top:1px}

/* ── TRADE LOG ────────────────────────────────────────────────────────────── */
.trade-log{padding:0 12px}
.trade-item{background:var(--bg3);border-radius:var(--r2);padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid}
.trade-item.buy{border-color:var(--up)}
.trade-item.sell{border-color:var(--dn)}
.trade-info{display:flex;flex-direction:column;gap:2px}
.trade-date{font-size:11px;color:var(--text3)}
.trade-action{font-size:12px;font-weight:700}
.trade-action.buy{color:var(--up)}
.trade-action.sell{color:var(--dn)}
.trade-pnl{font-size:14px;font-weight:800}
.trade-pnl.up{color:var(--up)}
.trade-pnl.dn{color:var(--dn)}

/* ── MARKET LIST ──────────────────────────────────────────────────────────── */
.mkt-list-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:10px;cursor:pointer;transition:background .15s}
.mkt-list-item:active{background:var(--bg3)}
.mkt-rank{width:22px;font-size:11px;color:var(--text3);text-align:center;font-weight:700}
.mkt-rank.top{color:var(--gold)}
.mkt-info{flex:1}
.mkt-name{font-size:13px;font-weight:700;margin-bottom:2px}
.mkt-code{font-size:11px;color:var(--text3)}
.mkt-price{text-align:right}
.mkt-price-val{font-size:14px;font-weight:800}
.mkt-pct{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:2px;display:inline-block}
.mkt-pct.up{background:rgba(34,197,94,.15);color:var(--up)}
.mkt-pct.dn{background:rgba(239,68,68,.15);color:var(--dn)}

/* ── LOADING / EMPTY ───────────────────────────────────────────────────────── */
.loading-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--text3)}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:50px 30px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-text{font-size:14px;font-weight:500}

/* ── MISC ─────────────────────────────────────────────────────────────────── */
.section-title{font-size:13px;font-weight:700;color:var(--text2);padding:14px 14px 6px;letter-spacing:.3px}
.tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.divider{height:1px;background:var(--border);margin:0 12px}
.up{color:var(--up)} .dn{color:var(--dn)}
</style>
</head>
<body>
<div id="app">

  <!-- ── TOP BAR ─────────────────────────────────────────── -->
  <div class="topbar">
    <span class="topbar-logo">TWSTOCK</span>
    <span class="topbar-badge">Pro v8</span>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" placeholder="股票代號 / 名稱" maxlength="10" enterkeyhint="search">
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       PAGE 1: 個股分析
  ══════════════════════════════════════════════════════════ -->
  <div id="page-stock" class="page active">

    <!-- 即時報價 Hero -->
    <div class="quote-hero" id="quoteHero" style="display:none">
      <div class="quote-header">
        <div>
          <div class="quote-name" id="qName">—</div>
          <div class="quote-code" id="qCode">—</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span id="liveDot" class="live-dot offline"></span>
          <span id="liveLabel" style="font-size:10px;color:var(--text3)">離線</span>
        </div>
      </div>
      <div class="quote-price-row">
        <div class="quote-price" id="qPrice">—</div>
        <div class="quote-change" id="qChange">—</div>
      </div>
      <div class="range-bar-wrap">
        <div class="range-bar-labels">
          <span id="qLow">—</span>
          <span style="color:var(--text3);font-size:10px">今日區間</span>
          <span id="qHigh">—</span>
        </div>
        <div class="range-bar"><div class="range-bar-cursor" id="rangeCursor" style="left:50%"></div></div>
      </div>
      <div class="quote-meta">
        <div class="quote-meta-item"><div class="quote-meta-label">開盤</div><div class="quote-meta-value" id="qOpen">—</div></div>
        <div class="quote-meta-item"><div class="quote-meta-label">成交量</div><div class="quote-meta-value" id="qVol">—</div></div>
        <div class="quote-meta-item"><div class="quote-meta-label">昨收</div><div class="quote-meta-value" id="qPrev">—</div></div>
      </div>
    </div>

    <!-- 初始提示 -->
    <div id="stockEmpty" class="empty-state">
      <div class="empty-icon">📈</div>
      <div class="empty-text">輸入股票代號開始分析</div>
    </div>

    <!-- 分析 Tab Bar -->
    <div id="stockTabs" style="display:none">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('chart')">K線圖</button>
        <button class="tab-btn" onclick="switchTab('indicators')">指標</button>
        <button class="tab-btn" onclick="switchTab('signals')">訊號</button>
        <button class="tab-btn" onclick="switchTab('ai')">AI分析</button>
        <button class="tab-btn" onclick="switchTab('institution')">法人</button>
      </div>

      <!-- K線圖 Tab -->
      <div id="tab-chart" class="tab-content active" style="padding-top:10px">
        <div class="chart-wrap">
          <div class="chart-box" style="height:280px"><canvas id="klineChart"></canvas></div>
        </div>
        <div class="chart-wrap">
          <div class="chart-box" style="height:90px"><canvas id="volumeChart"></canvas></div>
        </div>
      </div>

      <!-- 指標 Tab -->
      <div id="tab-indicators" class="tab-content" style="padding-top:10px">
        <div class="chart-wrap"><div class="chart-box" style="height:120px"><canvas id="rsiChart"></canvas></div></div>
        <div class="chart-wrap"><div class="chart-box" style="height:120px"><canvas id="macdChart"></canvas></div></div>
        <div class="chart-wrap"><div class="chart-box" style="height:120px"><canvas id="kdChart"></canvas></div></div>
      </div>

      <!-- 訊號 Tab -->
      <div id="tab-signals" class="tab-content" style="padding-top:10px">
        <div id="signalChips" class="signal-row"></div>
        <div style="display:flex;align-items:center;justify-content:center;gap:20px;padding:14px">
          <div class="score-circle" id="scoreCircle"><span id="scoreVal">—</span><span class="score-label" id="scoreLabel">—</span></div>
          <div style="flex:1">
            <div id="scoreDesc" style="font-size:13px;line-height:1.6;color:var(--text2)"></div>
          </div>
        </div>
        <div class="card" id="signalDetail"></div>
      </div>

      <!-- AI 分析 Tab -->
      <div id="tab-ai" class="tab-content" style="padding-top:10px">
        <div class="card">
          <div class="card-title">AI 深度分析</div>
          <div id="aiContent" style="font-size:13px;line-height:1.8;color:var(--text2)">
            <div class="loading-wrap"><div class="spinner"></div>正在分析中…</div>
          </div>
        </div>
      </div>

      <!-- 法人 Tab -->
      <div id="tab-institution" class="tab-content" style="padding-top:10px">
        <div class="card" id="institutionCard">
          <div class="loading-wrap"><div class="spinner"></div>載入中…</div>
        </div>
        <div class="card" id="marginCard">
          <div class="loading-wrap"><div class="spinner"></div>載入中…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       PAGE 2: 歷史回測
  ══════════════════════════════════════════════════════════ -->
  <div id="page-backtest" class="page">
    <div class="bt-controls">
      <div class="bt-row">
        <input id="btStock" class="bt-input" placeholder="股票代號（如 2330）" maxlength="6" value="2330">
        <select id="btStrategy" class="bt-select">
          <option value="rsi">RSI 策略</option>
          <option value="macd">MACD 策略</option>
          <option value="bb">布林通道</option>
          <option value="kd">KD 策略</option>
          <option value="combined">綜合策略</option>
        </select>
      </div>
      <div class="bt-row">
        <select id="btPeriod" class="bt-select">
          <option value="1y">近1年</option>
          <option value="2y" selected>近2年</option>
          <option value="3y">近3年</option>
          <option value="5y">近5年</option>
        </select>
        <input id="btCapital" class="bt-input" placeholder="初始資金（萬）" value="100" type="number" min="10" max="10000">
      </div>
      <div class="bt-row">
        <select id="btFee" class="bt-select">
          <option value="0.001425">手續費 0.1425%</option>
          <option value="0.002">手續費 0.2%</option>
          <option value="0">免手續費</option>
        </select>
        <button class="bt-btn" id="btRunBtn" onclick="runBacktest()">
          <span>▶</span> 執行回測
        </button>
      </div>
    </div>

    <div id="btLoading" style="display:none" class="loading-wrap"><div class="spinner"></div>回測計算中…</div>
    <div id="btEmpty" class="empty-state"><div class="empty-icon">🔬</div><div class="empty-text">設定參數後執行回測</div></div>
    <div id="btResultWrap" style="display:none">
      <!-- KPI 格 -->
      <div class="section-title" id="btTitle">回測結果</div>
      <div class="bt-results">
        <div class="bt-kpi-grid">
          <div class="bt-kpi"><div class="bt-kpi-val up" id="bt-totalReturn">—</div><div class="bt-kpi-label">總報酬率</div></div>
          <div class="bt-kpi"><div class="bt-kpi-val gold" id="bt-annReturn">—</div><div class="bt-kpi-label">年化報酬</div></div>
          <div class="bt-kpi"><div class="bt-kpi-val dn" id="bt-maxDD">—</div><div class="bt-kpi-label">最大回撤</div></div>
          <div class="bt-kpi"><div class="bt-kpi-val purple" id="bt-sharpe">—</div><div class="bt-kpi-label">Sharpe Ratio</div></div>
          <div class="bt-kpi"><div class="bt-kpi-val" id="bt-winRate">—</div><div class="bt-kpi-label">勝率</div></div>
          <div class="bt-kpi"><div class="bt-kpi-val" id="bt-trades">—</div><div class="bt-kpi-label">交易次數</div></div>
        </div>
      </div>

      <!-- 資金曲線 -->
      <div class="chart-wrap">
        <div class="chart-box" style="height:220px">

// ═══════════════════════════════════════════════════════════════════
//  INDICATORS
// ═══════════════════════════════════════════════════════════════════
function calcSMA(closes, period) {
  return closes.map((_, i) => {
    if (i < period - 1) return null;
    return closes.slice(i - period + 1, i + 1).reduce((a,b)=>a+b,0) / period;
  });
}

function calcEMA(closes, period) {
  const k   = 2 / (period + 1);
  const ema = [];
  closes.forEach((v, i) => {
    if (i === 0) ema.push(v);
    else ema.push(v * k + ema[i-1] * (1 - k));
  });
  return ema;
}

function calcBB(closes, period = 20, mult = 2) {
  const sma = calcSMA(closes, period);
  return closes.map((_, i) => {
    if (i < period - 1) return { upper: null, mid: null, lower: null };
    const slice = closes.slice(i - period + 1, i + 1);
    const mean  = sma[i];
    const std   = Math.sqrt(slice.reduce((s,v) => s + (v-mean)**2, 0) / period);
    return { upper: mean + mult*std, mid: mean, lower: mean - mult*std };
  });
}

function calcRSI(closes, period = 14) {
  const rsi = new Array(closes.length).fill(null);
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) gains += d; else losses -= d;
  }
  gains  /= period; losses /= period;
  rsi[period] = 100 - 100 / (1 + gains / (losses || 0.001));
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    gains   = (gains  * (period-1) + Math.max(d,0))  / period;
    losses  = (losses * (period-1) + Math.max(-d,0)) / period;
    rsi[i]  = 100 - 100 / (1 + gains / (losses || 0.001));
  }
  return rsi;
}

function calcMACD(closes) {
  const ema12 = calcEMA(closes, 12);
  const ema26 = calcEMA(closes, 26);
  const dif   = ema12.map((v,i) => v - ema26[i]);
  const dea   = calcEMA(dif, 9);
  const hist  = dif.map((v,i) => (v - dea[i]) * 2);
  return { dif, dea, hist };
}

function calcKD(highs, lows, closes, period = 9) {
  const k = [], d = [];
  let kPrev = 50, dPrev = 50;
  closes.forEach((c, i) => {
    if (i < period - 1) { k.push(null); d.push(null); return; }
    const hh = Math.max(...highs.slice(i-period+1, i+1));
    const ll  = Math.min(...lows.slice(i-period+1, i+1));
    const rsv = hh === ll ? 50 : ((c - ll) / (hh - ll)) * 100;
    kPrev = kPrev * 2/3 + rsv   / 3;
    dPrev = dPrev * 2/3 + kPrev / 3;
    k.push(kPrev); d.push(dPrev);
  });
  return { k, d };
}

function calcVWAP(candles) {
  let cumTPV = 0, cumVol = 0;
  return candles.map(c => {
    const tp = (c.high + c.low + c.close) / 3;
    cumTPV  += tp * c.vol;
    cumVol  += c.vol;
    return cumVol ? cumTPV / cumVol : c.close;
  });
}

        { label:"VWAP", data: dates.map((d,i)=>({x:d.getTime(),y:vwap[i]})),  type:"line", borderColor:"#06b6d4", borderWidth:1, borderDash:[4,3], pointRadius:0, fill:false },

// ═══════════════════════════════════════════════════════════════════
//  SIGNALS & SCORE
// ═══════════════════════════════════════════════════════════════════
function computeSignals(candles) {
  if (candles.length < 30) return;
  const closes = candles.map(c => c.close);
  const highs  = candles.map(c => c.high);
  const lows   = candles.map(c => c.low);
  const n      = closes.length - 1;

  const rsi       = calcRSI(closes);
  const { dif, dea } = calcMACD(closes);
  const { k, d }  = calcKD(highs, lows, closes);
  const bb        = calcBB(closes);
  const sma20     = calcSMA(closes, 20);
  const sma60     = calcSMA(closes, 60);

  const signals = [];
  let score = 50;

  // RSI
  const rsiNow = rsi[n];
  if (rsiNow < 30)      { signals.push({ label:"RSI超賣", type:"bull" }); score += 12; }
  else if (rsiNow > 70) { signals.push({ label:"RSI超買", type:"bear" }); score -= 12; }
  else                   { signals.push({ label:`RSI ${rsiNow?.toFixed(0)}`, type:"neu" }); }

  // MACD 金叉/死叉
  if (dif[n] > dea[n] && dif[n-1] <= dea[n-1]) { signals.push({ label:"MACD金叉", type:"bull" }); score += 15; }
  if (dif[n] < dea[n] && dif[n-1] >= dea[n-1]) { signals.push({ label:"MACD死叉", type:"bear" }); score -= 15; }
  if (dif[n] > dea[n]) { signals.push({ label:"MACD多方", type:"bull" }); score += 5; }

  // KD
  if (k[n] < 20 && d[n] < 20) { signals.push({ label:"KD超賣", type:"bull" }); score += 10; }
  if (k[n] > 80 && d[n] > 80) { signals.push({ label:"KD超買", type:"bear" }); score -= 10; }
  if (k[n] > d[n] && k[n-1] <= d[n-1]) { signals.push({ label:"KD黃金交叉", type:"bull" }); score += 12; }
  if (k[n] < d[n] && k[n-1] >= d[n-1]) { signals.push({ label:"KD死亡交叉", type:"bear" }); score -= 12; }

  // BB
  const bbNow = bb[n];
  if (bbNow.lower && closes[n] <= bbNow.lower) { signals.push({ label:"BB下軌支撐", type:"bull" }); score += 10; }
  if (bbNow.upper && closes[n] >= bbNow.upper) { signals.push({ label:"BB上軌壓力", type:"bear" }); score -= 10; }

  // MA 趨勢
  if (sma20[n] && sma60[n]) {
    if (sma20[n] > sma60[n]) { signals.push({ label:"短線多頭", type:"bull" }); score += 8; }
    else                      { signals.push({ label:"短線空頭", type:"bear" }); score -= 8; }
  }

  score = Math.max(0, Math.min(100, score));

  // 渲染 chips
  const chipsEl = document.getElementById("signalChips");
  chipsEl.innerHTML = signals.map(s =>
    `<div class="signal-chip ${s.type}">${s.type === "bull" ? "🔼" : s.type === "bear" ? "🔽" : "⬛"} ${s.label}</div>`
  ).join("");

  // Score circle
  const circle = document.getElementById("scoreCircle");
  const cls    = score >= 60 ? "bull" : score <= 40 ? "bear" : "neu";
  circle.className = "score-circle " + cls;
  document.getElementById("scoreVal").textContent   = score;
  document.getElementById("scoreLabel").textContent = score >= 60 ? "偏多" : score <= 40 ? "偏空" : "中性";
  document.getElementById("scoreDesc").textContent  =
    score >= 70 ? "多項技術指標顯示強勢多頭訊號，可考慮分批建倉。" :
    score >= 60 ? "技術面偏多，但需注意量能配合。" :

  const candles = state.candles.slice(-30);

  const last = candles[candles.length - 1];
  const prev = candles[candles.length - 2];
  const pct  = ((last.close - prev.close) / prev.close * 100).toFixed(2);

  const prompt = `你是台灣股市專業分析師。請用繁體中文對以下股票作200字內的技術面與基本面綜合分析，包含短線操作建議：

近30日最高：${Math.max(...candles.map(c=>c.high)).toFixed(2)}
近30日最低：${Math.min(...candles.map(c=>c.low)).toFixed(2)}
近期成交量趨勢：${candles.slice(-5).map(c=>c.vol).join(",")}
請給出：1.趨勢判斷 2.關鍵支撐/壓力 3.操作建議`;

  try {
    const r = await fetch(PROXY + "?type=gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
    });
    const j    = await r.json();
    const text = j.candidates?.[0]?.content?.parts?.[0]?.text || "AI 暫時無法回應";
    el.innerHTML = text.replace(/\n/g, "<br>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  } catch(e) {
    el.innerHTML = "AI 分析失敗，請稍後重試。";
  }
}

async function runBacktest() {
  const code     = document.getElementById("btStock").value.trim().toUpperCase();
  const strategy = document.getElementById("btStrategy").value;
  const period   = document.getElementById("btPeriod").value;
  const capital  = parseFloat(document.getElementById("btCapital").value) * 10000;
  const feeRate  = parseFloat(document.getElementById("btFee").value);

  if (!code) return;

  document.getElementById("btEmpty").style.display      = "none";
  document.getElementById("btResultWrap").style.display = "none";
  document.getElementById("btLoading").style.display    = "flex";
  document.getElementById("btRunBtn").classList.add("loading");

  try {
    // 抓K線（回測用更長期）
    const limitMap = { "1y":250, "2y":500, "3y":750, "5y":1250 };
    const data = await api({ type: "kline_range", stockCode: code, limit: limitMap[period] || 500 });
    const candles = data.candles || [];

    if (candles.length < 60) {
      alert("資料不足，無法回測");
      document.getElementById("btLoading").style.display = "none";
      document.getElementById("btEmpty").style.display   = "block";
      document.getElementById("btRunBtn").classList.remove("loading");
      return;
    }

    const result = backtestStrategy(candles, strategy, capital, feeRate);

  }

  document.getElementById("btLoading").style.display  = "none";
  document.getElementById("btRunBtn").classList.remove("loading");
}

// ── 策略執行引擎 ──────────────────────────────────────────────────
function backtestStrategy(candles, strategy, initCapital, feeRate) {
  const closes = candles.map(c => c.close);
  const highs  = candles.map(c => c.high);
  const lows   = candles.map(c => c.low);

  // 計算各指標
  const rsi        = calcRSI(closes);
  const { dif, dea } = calcMACD(closes);
  const { k, d }   = calcKD(highs, lows, closes);
  const bb         = calcBB(closes);
  const sma20      = calcSMA(closes, 20);

  // 生成訊號
  function getSignal(i) {
    if (i < 30) return 0;
    switch(strategy) {
      case "rsi":
        if (rsi[i] < 30 && rsi[i-1] >= 30) return  1;
        if (rsi[i] > 70 && rsi[i-1] <= 70) return -1;
        break;
      case "macd":
        if (dif[i] > dea[i] && dif[i-1] <= dea[i-1]) return  1;
        if (dif[i] < dea[i] && dif[i-1] >= dea[i-1]) return -1;
        break;
      case "bb":
        if (closes[i] <= bb[i].lower && closes[i-1] > bb[i-1].lower) return  1;
        if (closes[i] >= bb[i].upper && closes[i-1] < bb[i-1].upper) return -1;
        break;
      case "kd":
        if (k[i] > d[i] && k[i-1] <= d[i-1] && k[i] < 50) return  1;
        if (k[i] < d[i] && k[i-1] >= d[i-1] && k[i] > 50) return -1;
        break;
      case "combined":
        const bullScore =
          (rsi[i] < 40 ? 1 : 0) + (dif[i] > dea[i] ? 1 : 0) +
          (k[i] > d[i] ? 1 : 0) + (closes[i] > sma20[i] ? 1 : 0);
        const bearScore =
          (rsi[i] > 60 ? 1 : 0) + (dif[i] < dea[i] ? 1 : 0) +
          (k[i] < d[i] ? 1 : 0) + (closes[i] < sma20[i] ? 1 : 0);
        if (bullScore >= 3 && bullScore > bearScore) return  1;
        if (bearScore >= 3 && bearScore > bullScore) return -1;
        break;
    }
    return 0;
  }

  // 回測模擬
  const trades    = [];
  const equity    = [{ date: candles[0].date, value: initCapital }];
  let cash        = initCapital;
  let shares      = 0;
  let entryPrice  = 0;
  let entryDate   = "";
  let inPosition  = false;

  for (let i = 30; i < candles.length; i++) {
    const sig   = getSignal(i);
    const price = closes[i];
    const date  = candles[i].date;

    if (!inPosition && sig === 1) {
      // 買入
      const cost  = price * (1 + feeRate);
      shares       = Math.floor(cash / (cost * 1000)) * 1000; // 以張為單位
      if (shares <= 0) shares = 1;
      cash        -= shares * cost;
      entryPrice   = price;
      entryDate    = date;
      inPosition   = true;
    } else if (inPosition && sig === -1) {
      // 賣出
      const proceed = shares * price * (1 - feeRate - 0.003); // 含交易稅
      const pnl     = proceed - shares * entryPrice;
      cash         += proceed;
      trades.push({
        buyDate:   entryDate,
        sellDate:  date,
        buyPrice:  entryPrice,
        sellPrice: price,
        shares,
        pnl:       Math.round(pnl),
        pnlPct:    ((price - entryPrice) / entryPrice * 100).toFixed(2),
      });
      shares     = 0;
      inPosition = false;
    }

    const portfolioVal = cash + (inPosition ? shares * price : 0);
    if (i % 5 === 0 || i === candles.length - 1) {
      equity.push({ date, value: portfolioVal });
    }
  }

  // 強制平倉（最後一筆）
  if (inPosition) {
    const price   = closes[closes.length - 1];
    const proceed = shares * price * (1 - feeRate - 0.003);
    const pnl     = proceed - shares * entryPrice;
    cash         += proceed;
    trades.push({
      buyDate: entryDate, sellDate: candles[candles.length-1].date,
      buyPrice: entryPrice, sellPrice: price, shares,
      pnl: Math.round(pnl),
      pnlPct: ((price - entryPrice) / entryPrice * 100).toFixed(2),
    });
  }

  const finalVal    = equity[equity.length - 1]?.value || initCapital;
  const totalReturn = (finalVal - initCapital) / initCapital * 100;
  const days        = (new Date(candles[candles.length-1].date) - new Date(candles[0].date)) / 86400000;
  const years       = days / 365;
  const annReturn   = (Math.pow(finalVal / initCapital, 1 / Math.max(years, 0.1)) - 1) * 100;

  // 最大回撤
  let maxDD = 0, peak = initCapital;
  for (const e of equity) {
    if (e.value > peak) peak = e.value;
    const dd = (peak - e.value) / peak * 100;
    if (dd > maxDD) maxDD = dd;
  }

  // Sharpe（簡化版）
  const returns  = equity.slice(1).map((e,i) => (e.value - equity[i].value) / equity[i].value);
  const avgR     = returns.reduce((a,b)=>a+b,0) / returns.length;
  const stdR     = Math.sqrt(returns.reduce((s,v)=>(s + (v-avgR)**2), 0) / returns.length);
  const sharpe   = stdR ? (avgR / stdR * Math.sqrt(252)).toFixed(2) : "N/A";

  const wins     = trades.filter(t => t.pnl > 0);
  const winRate  = trades.length ? (wins.length / trades.length * 100).toFixed(1) : 0;

  // 月度績效
  const monthlyMap = {};
  for (const e of equity) {
    const key = e.date.slice(0, 7);
    monthlyMap[key] = e.value;
  }
  const months    = Object.keys(monthlyMap).sort();
  const monthlyRet = months.slice(1).map((m, i) => {
    const prev = monthlyMap[months[i]];
    const curr = monthlyMap[m];
    return { month: m, ret: prev ? (curr - prev) / prev * 100 : 0 };
  });

  return { totalReturn, annReturn, maxDD, sharpe, winRate, trades, equity, monthlyRet, initCapital, finalVal, candles };
}

// ═══════════════════════════════════════════════════════════════════
//  RENDER BACKTEST RESULT
// ═══════════════════════════════════════════════════════════════════
function renderBacktestResult(r, code, strategy) {
  const stratNames = { rsi:"RSI", macd:"MACD", bb:"布林通道", kd:"KD", combined:"綜合" };
  document.getElementById("btTitle").textContent = `${code} ${stratNames[strategy]} 回測結果`;

  document.getElementById("bt-totalReturn").textContent = r.totalReturn.toFixed(1) + "%";
  document.getElementById("bt-totalReturn").className   = "bt-kpi-val " + (r.totalReturn>=0?"up":"dn");
  document.getElementById("bt-annReturn").textContent   = r.annReturn.toFixed(1) + "%";
  document.getElementById("bt-annReturn").className     = "bt-kpi-val " + (r.annReturn>=0?"gold":"dn");
  document.getElementById("bt-maxDD").textContent       = "-" + r.maxDD.toFixed(1) + "%";
  document.getElementById("bt-sharpe").textContent      = r.sharpe;
  document.getElementById("bt-winRate").textContent     = r.winRate + "%";
  document.getElementById("bt-winRate").className       = "bt-kpi-val " + (parseFloat(r.winRate)>=50?"up":"dn");
  document.getElementById("bt-trades").textContent      = r.trades.length + " 筆";

  // 資金曲線
  destroyChart("equity");
  const eCtx = document.getElementById("equityChart").getContext("2d");
  const eqDates = r.equity.map(e => new Date(e.date));
  const eqVals  = r.equity.map(e => Math.round(e.value));
  state.charts.equity = new Chart(eCtx, {
    type: "line",
    data: {
      labels: eqDates,
      datasets: [{
        data:        eqVals,
        borderColor: r.finalVal >= r.initCapital ? "#22c55e" : "#ef4444",
        borderWidth: 2,
        pointRadius: 0,
        fill:        true,
        backgroundColor: r.finalVal >= r.initCapital
          ? "rgba(34,197,94,.08)" : "rgba(239,68,68,.08)",
        tension: 0.3,
      }]
    },
    options: {
      ...CHART_OPTS,
      scales: {
        ...CHART_OPTS.scales,
        y: { ...CHART_OPTS.scales.y, ticks: { callback: v => (v/10000).toFixed(0)+"萬", color:"#64748b", font:{size:10} } }
      }
    }
  });

  // 月度熱力圖
  const hm = document.getElementById("heatmapGrid");
  hm.innerHTML = r.monthlyRet.slice(-24).map(m => {
    const ret = m.ret;
    const abs = Math.min(Math.abs(ret), 10);
    const alpha = abs / 10;
    const bg = ret >= 0
      ? `rgba(34,197,94,${0.15 + alpha * 0.6})`
      : `rgba(239,68,68,${0.15 + alpha * 0.6})`;
    return `<div class="hm-cell" style="background:${bg}" title="${m.month}: ${ret.toFixed(1)}%">
      <span>${ret > 0 ? "+" : ""}${ret.toFixed(0)}%</span>
      <span class="hm-label">${m.month.slice(5)}</span>
    </div>`;
  }).join("");

  // 交易記錄（最近20筆）
  const tradeLog = document.getElementById("tradeLog");
  document.getElementById("btTradeCount").textContent = `共 ${r.trades.length} 筆`;
  tradeLog.innerHTML = r.trades.slice(-20).reverse().map(t => `
    <div class="trade-item ${t.pnl>=0?"buy":"sell"}">
      <div class="trade-info">
        <div class="trade-action ${t.pnl>=0?"buy":"sell"}">${t.pnl>=0?"▲ 獲利":"▼ 虧損"}</div>
        <div class="trade-date">買 ${t.buyDate} @ ${t.buyPrice.toFixed(2)}</div>
        <div class="trade-date">賣 ${t.sellDate} @ ${t.sellPrice.toFixed(2)}</div>
      </div>
      <div class="trade-pnl ${t.pnl>=0?"up":"dn"}">${t.pnl>=0?"+":""}${t.pnl.toLocaleString()}<br><span style="font-size:11px">${t.pnlPct}%</span></div>
    </div>
  `).join("");

  document.getElementById("btResultWrap").style.display = "block";
  document.getElementById("btEmpty").style.display      = "none";
}

async function loadScreener() {
  const el = document.getElementById("screenerContent");
  el.innerHTML = '<div class="loading-wrap"><div class="spinner"></div>智能選股中…</div>';

  const sample  = TW50.slice(0, 20);
  const results = await Promise.allSettled(sample.map(code =>
    api({ type:"kline", stockCode:code }).then(d => ({ code, candles: d.candles||[] }))
  ));

  const scored = [];
  for (const r of results) {
    if (r.status !== "fulfilled") continue;
    const { code, candles } = r.value;
    if (candles.length < 30) continue;
    const closes = candles.map(c => c.close);
    const highs  = candles.map(c => c.high);
    const lows   = candles.map(c => c.low);
    const n      = closes.length - 1;
    const rsi    = calcRSI(closes);
    const { dif, dea } = calcMACD(closes);
    const { k, d } = calcKD(highs, lows, closes);
    let score = 50;
    if (rsi[n] < 40) score += 10;
    if (dif[n] > dea[n]) score += 15;
    if (k[n] > d[n]) score += 10;
    if (closes[n] > closes[n-1]) score += 5;
    scored.push({ code, score, price: closes[n] });
  }
  scored.sort((a,b) => b.score - a.score);

  el.innerHTML = `
    <div class="section-title">智能選股 — 技術面評分 TOP</div>
    ${scored.slice(0, 10).map((s, i) => `
      <div class="mkt-list-item" onclick="loadStock('${s.code}');switchPage('stock')">
        <div class="mkt-rank ${i<3?"top":""}">${i+1}</div>
        <div class="mkt-info">
          <div class="mkt-name">${s.code}</div>
          <div class="mkt-code">評分 ${s.score}</div>
        </div>
        <div class="mkt-price">
          <div class="mkt-price-val">${s.price?.toFixed(2)}</div>
          <div style="font-size:11px;font-weight:600;color:${s.score>=65?"var(--up)":s.score<=40?"var(--dn)":"var(--gold)"}">${s.score>=65?"強勢":s.score<=40?"弱勢":"中性"}</div>
        </div>
      </div>
    `).join("")}
  `;
}

// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════
function waitForChartJS(cb, attempts = 0) {
  if (typeof Chart !== "undefined" && Chart.registry) {
    cb();
  } else if (attempts < 30) {
    setTimeout(() => waitForChartJS(cb, attempts + 1), 200);
  }
}
waitForChartJS(() => loadStock("2330"));
</script>
