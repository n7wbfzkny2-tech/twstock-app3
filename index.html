.bt-toolbar{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px;background:#141921;border:1px solid #1e2d3d;border-radius:12px;margin-bottom:8px;}
.bt-toolbar-left{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
.bt-toolbar-right{display:flex;align-items:center;gap:10px;}
.bt-field{display:flex;flex-direction:column;gap:4px;}
.bt-field label{font-size:11px;color:#4a6080;text-transform:uppercase;letter-spacing:.5px;}

.bt-field input:focus,.bt-field select:focus{border-color:#f0a500;}
#bt-run-btn{background:linear-gradient(135deg,#f0a500,#ff6b35);color:#000;border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
#bt-run-btn:disabled{opacity:.5;cursor:not-allowed;}
.bt-badge{font-size:11px;font-weight:700;color:#f0a500;background:rgba(240,165,0,.12);border:1px solid rgba(240,165,0,.3);border-radius:20px;padding:3px 10px;letter-spacing:.5px;}
.bt-params-bar{display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:10px 16px;background:#1c2330;border:1px solid #1e2d3d;border-radius:10px;margin-bottom:14px;}
.bt-param-group{display:flex;align-items:center;gap:8px;}
.bt-param-label{font-size:12px;color:#4a6080;}
.bt-param-group input{width:60px;background:#0a0c0f;border:1px solid #1e2d3d;color:#e8edf5;border-radius:5px;padding:5px 8px;font-size:13px;outline:none;font-family:‘IBM Plex Mono’,monospace;}
.bt-params-hint{font-size:11px;color:#4a6080;margin-left:auto;font-style:italic;}
.bt-loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:48px;color:#4a6080;font-size:14px;}
.bt-spinner{width:22px;height:22px;border:3px solid #1e2d3d;border-top-color:#f0a500;border-radius:50%;animation:bt-spin .7s linear infinite;}
.bt-error{background:rgba(255,61,87,.08);border:1px solid rgba(255,61,87,.3);border-radius:10px;color:#ff3d57;padding:14px 16px;font-size:14px;margin-bottom:14px;}
.bt-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
.bt-kpi-card{background:#141921;border:1px solid #1e2d3d;border-radius:12px;padding:14px 12px;text-align:center;}
.bt-kpi-card.bt-kpi-main{border-color:rgba(240,165,0,.4);background:rgba(240,165,0,.05);}
.bt-kpi-label{font-size:10px;color:#4a6080;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.bt-kpi-value{font-size:20px;font-weight:700;color:#e8edf5;line-height:1;font-family:‘IBM Plex Mono’,monospace;}
.bt-kpi-main .bt-kpi-value{font-size:26px;color:#f0a500;}
.bt-kpi-sub{font-size:11px;color:#4a6080;margin-top:4px;}
.bt-positive{color:#00d084!important;}
.bt-negative{color:#ff3d57!important;}
.bt-chart-section,.bt-trades-section,.bt-monthly-section{background:#141921;border:1px solid #1e2d3d;border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.bt-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.bt-section-header h3{font-size:13px;color:#e8edf5;margin:0;font-weight:600;}
.bt-chart-legend{display:flex;align-items:center;font-size:11px;color:#4a6080;}
.bt-legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;}
.bt-table-wrap{overflow-x:auto;}
.bt-table{width:100%;border-collapse:collapse;font-size:12px;}
.bt-table thead th{background:#1c2330;color:#4a6080;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;text-align:right;border-bottom:1px solid #1e2d3d;}
.bt-table thead th:first-child{text-align:left;}
.bt-table tbody tr{border-bottom:1px solid rgba(30,45,61,.5);}

.bt-table td{padding:7px 10px;color:#e8edf5;text-align:right;white-space:nowrap;font-family:‘IBM Plex Mono’,monospace;font-size:12px;}

@media(max-width:480px){.bt-params-hint{display:none;}.bt-toolbar{flex-direction:column;}.bt-toolbar-right{justify-content:flex-end;}}

// 所有族群合併（去重）
function getAllSectorStocks() {
const seen = new Set();
const all = [];
for (const key of Object.keys(SECTOR_LISTS)) {
for (const s of SECTOR_LISTS[key].stocks) {
if (!seen.has(s.code)) {
seen.add(s.code);
all.push({…s, theme: SECTOR_LISTS[key].name});
}
}
}
return all;
}

// ── 指標計算 ──
function calcMA(c,p){return c.map((*,i)=>i<p-1?null:c.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p);}
function calcEMA(d,p){const k=2/(p+1);let e=null;return d.map(v=>{if(v==null)return null;e=e===null?v:v*k+e*(1-k);return e;});}
function calcRSI(c,p=14){
if(c.length<p+1)return[];
const r=new Array(p).fill(null);let ag=0,al=0;
for(let i=1;i<=p;i++){const d=c[i]-c[i-1];if(d>0)ag+=d;else al+=Math.abs(d);}
ag/=p;al/=p;r.push(al===0?100:100-(100/(1+ag/al)));
for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?Math.abs(d):0))/p;r.push(al===0?100:100-(100/(1+ag/al)));}
return r;
}
function calcMACD(c){
const e12=calcEMA(c,12),e26=calcEMA(c,26);
const ml=e12.map((v,i)=>v&&e26[i]?v-e26[i]:null);
const valid=ml.filter(v=>v!==null);const sRaw=calcEMA(valid,9);
let si=0;const sig=ml.map(v=>v===null?null:sRaw[si++]??null);
return{ml,sig,hist:ml.map((v,i)=>v&&sig[i]?v-sig[i]:null)};
}
function calcKD(data,p=9){
let k=50,d=50;
return data.map((*,i)=>{
if(i<p-1)return{k:null,d:null};
const sl=data.slice(i-p+1,i+1);
const hi=Math.max(…sl.map(x=>x.high)),lo=Math.min(…sl.map(x=>x.low));
const rsv=hi===lo?50:((data[i].close-lo)/(hi-lo))*100;
k=k*2/3+rsv/3;d=d*2/3+k/3;return{k,d};
});
}
function calcBB(c,p=20,m=2){
return c.map((_,i)=>{
if(i<p-1)return{mid:null,upper:null,lower:null};
const sl=c.slice(i-p+1,i+1);const mid=sl.reduce((a,b)=>a+b,0)/p;
const std=Math.sqrt(sl.reduce((s,v)=>s+(v-mid)**2,0)/p);
return{mid,upper:mid+m*std,lower:mid-m*std};
});
}
function calcWeekRSI(data){
if(!data||data.length<15)return null;
const w=[];for(let i=0;i<data.length;i+=5){const sl=data.slice(i,i+5);if(sl.length<3)break;w.push(sl[sl.length-1].close);}
const r=calcRSI(w,9);return r.filter(v=>v!==null).slice(-1)[0];
}
function calcBias(c,p=20){const ma=calcMA(c,p);return c.map((v,i)=>ma[i]===null?null:((v-ma[i])/ma[i])*100);}
function calcVWAP(data){
if(!data||data.length<5)return null;
const r=data.slice(-20);let pv=0,v=0;
for(const d of r){const tp=(d.high+d.low+d.close)/3;const vol=d.vol||1;pv+=tp*vol;v+=vol;}
return v>0?Math.round(pv/v*100)/100:null;
}
function detectDiv(data){
if(!data||data.length<10)return[];const s=[];
for(let i=5;i<data.length;i++){const pC=(data[i].close-data[i-5].close)/data[i-5].close;const vC=(data[i].vol-data[i-5].vol)/data[i-5].vol;if(pC>0.03&&vC<-0.3)s.push({type:“頂背離”,color:C.r});else if(pC<-0.03&&vC<-0.3)s.push({type:“底背離”,color:C.g});}
return s.slice(-2);
}
function detectVolSpike(data){
if(!data||data.length<20)return{spike:false,ratio:0};
const avg=data.slice(-20,-1).map(d=>d.vol||0).reduce((a,b)=>a+b,0)/19;
const last=data[data.length-1];const ratio=avg>0?last.vol/avg:0;
return{spike:ratio>=2&&last.close>=last.open,ratio:Math.round(ratio*10)/10};
}
function detectGap(data){
if(!data||data.length<2)return{hasGap:false};
const l=data[data.length-1],p=data[data.length-2];
if(l.low>p.high){const gs=((l.low-p.high)/p.high*100).toFixed(2);return{hasGap:true,type:“up”,gapSize:+gs,label:`跳空+${gs}%`,color:C.g};}
if(l.high<p.low){const gs=((p.low-l.high)/p.low*100).toFixed(2);return{hasGap:true,type:“down”,gapSize:+gs,label:`跳空-${gs}%`,color:C.r};}
return{hasGap:false};
}
function detectMAConflict(c){
if(!c||c.length<65)return{conflict:false,tightness:0};
const ma5=calcMA(c,5).filter(v=>v!==null).slice(-1)[0];
const ma20=calcMA(c,20).filter(v=>v!==null).slice(-1)[0];
const ma60=calcMA(c,60).filter(v=>v!==null).slice(-1)[0];
if(!ma5||!ma20||!ma60)return{conflict:false,tightness:0};
const t=(Math.max(ma5,ma20,ma60)-Math.min(ma5,ma20,ma60))/Math.min(ma5,ma20,ma60)*100;
return{conflict:t<3,tightness:Math.round(t*10)/10,ma5,ma20,ma60,bullish:ma5>ma20&&ma20>ma60,bearish:ma5<ma20&&ma20<ma60};
}
function calcSR(data){
if(!data||data.length<20)return{supports:[],resistances:[]};
const sl=data.slice(-60);const price=data[data.length-1].close;
const pH=[],pL=[];
for(let i=2;i<sl.length-2;i++){
if(sl[i].high>sl[i-1].high&&sl[i].high>sl[i-2].high&&sl[i].high>sl[i+1].high&&sl[i].high>sl[i+2].high)pH.push(sl[i].high);
if(sl[i].low<sl[i-1].low&&sl[i].low<sl[i-2].low&&sl[i].low<sl[i+1].low&&sl[i].low<sl[i+2].low)pL.push(sl[i].low);
}
function cluster(arr){const s=[…arr].sort((a,b)=>a-b);const cl=[];let cur=[s[0]];for(let i=1;i<s.length;i++){if((s[i]-cur[0])/cur[0]<0.015)cur.push(s[i]);else{cl.push(cur.reduce((a,b)=>a+b,0)/cur.length);cur=[s[i]];}}if(cur.length)cl.push(cur.reduce((a,b)=>a+b,0)/cur.length);return cl;}
return{supports:cluster(pL).filter(v=>v<price).sort((a,b)=>b-a).slice(0,3),resistances:cluster(pH).filter(v=>v>price).sort((a,b)=>a-b).slice(0,3)};
}
function multiTF(data){
if(!data||data.length<30)return{daily:“不足”,weekly:“不足”,monthly:“不足”,aligned:false,allBear:false};
const c=data.map(d=>d.close);
const dma5=calcMA(c,5).filter(v=>v!==null).slice(-1)[0];const dma20=calcMA(c,20).filter(v=>v!==null).slice(-1)[0];
const daily=dma5>dma20?“多頭”:“空頭”;
const w=[];for(let i=0;i<data.length;i+=5){const sl=data.slice(i,i+5);if(sl.length<3)break;w.push(sl[sl.length-1].close);}
const wma5=calcMA(w,5).filter(v=>v!==null).slice(-1)[0];const wma10=calcMA(w,10).filter(v=>v!==null).slice(-1)[0];
const weekly=wma5&&wma10?(wma5>wma10?“多頭”:“空頭”):“不足”;
return{daily,weekly,monthly:“不足”,aligned:daily===“多頭”&&weekly===“多頭”,allBear:daily===“空頭”&&weekly===“空頭”};
}

// ── 買賣訊號 ──
function calcSignals(kline,inst){
if(!kline||kline.length<30)return{buy:[],sell:[],strength:“insufficient”,label:“資料不足”,color:C.t2,buyScore:0,sellScore:0};
const c=kline.map(d=>d.close);
const rsi=calcRSI(c),wRSI=calcWeekRSI(kline),macd=calcMACD(c),kd=calcKD(kline),bb=calcBB(c),ma20=calcMA(c,20);
const price=c[c.length-1],prev=c[c.length-2];

function scoreStock(quote,kline,inst){

const divs=detectDiv(kline);const volS=detectVolSpike(kline);const gap=detectGap(kline);
const mac=detectMAConflict(c);const mtf=multiTF(kline);

const vwap=calcVWAP(kline);
const details=[];

if(lma5&&lma20&&lma60){
if(lma5>lma20&&lma20>lma60){tScore+=25;details.push({label:“均線多頭排列”,value:“MA5>20>60”,color:C.g,pts:25,mode:“trend”});}
else if(lma5>lma20){tScore+=10;details.push({label:“短線偏多”,value:“MA5>MA20”,color:C.g,pts:10,mode:“trend”});}
else if(lma5<lma20&&lma20<lma60){tScore-=10;details.push({label:“均線空頭”,value:“MA5<20<60”,color:C.r,pts:-10,mode:“trend”});}
}
if(lH!=null&&pH!=null){
if(lH>0&&pH<=0){tScore+=20;details.push({label:“MACD黃金交叉”,value:“剛翻正”,color:C.g,pts:20,mode:“trend”});}
else if(lH>0&&lH>pH){tScore+=15;details.push({label:“MACD多頭擴張”,value:`${lML?.toFixed(1)}`,color:C.g,pts:15,mode:“trend”});}
else if(lH>0){tScore+=8;details.push({label:“MACD多頭”,value:“正值”,color:C.g,pts:8,mode:“trend”});}
else if(lH<0&&pH>=0){tScore-=15;details.push({label:“MACD死亡交叉”,value:“剛翻負”,color:C.r,pts:-15,mode:“trend”});}
else if(lH<0){tScore-=5;details.push({label:“MACD空頭”,value:“負值”,color:C.r,pts:-5,mode:“trend”});}
}
if(mtf.aligned){tScore+=20;details.push({label:“日週多頭共振”,value:“同向上漲”,color:C.g,pts:20,mode:“trend”});}
else if(mtf.allBear){tScore-=15;details.push({label:“日週空頭”,value:“同向下跌”,color:C.r,pts:-15,mode:“trend”});}
if(vwap&&price>vwap){tScore+=10;details.push({label:“站上VWAP”,value:vwap.toFixed(0),color:C.g,pts:10,mode:“trend”});}
else if(vwap&&price<vwap){tScore-=5;details.push({label:“低於VWAP”,value:vwap.toFixed(0),color:C.r,pts:-5,mode:“trend”});}
if(volS.spike){tScore+=15;details.push({label:“爆量收紅”,value:`${volS.ratio}倍均量`,color:C.g,pts:15,mode:“trend”});}
if(gap.hasGap&&gap.type===“up”){tScore+=10;details.push({label:“向上跳空”,value:`+${gap.gapSize}%`,color:C.g,pts:10,mode:“trend”});}
else if(gap.hasGap&&gap.type===“down”){tScore-=10;details.push({label:“向下跳空”,value:`-${gap.gapSize}%`,color:C.r,pts:-10,mode:“trend”});}
if(inst&&!inst.error){
if(inst.foreign>2000){tScore+=15;details.push({label:“外資大買”,value:`+${inst.foreign.toLocaleString()}`,color:C.g,pts:15,mode:“trend”});}
else if(inst.foreign>500){tScore+=8;details.push({label:“外資買超”,value:`+${inst.foreign.toLocaleString()}`,color:C.g,pts:8,mode:“trend”});}
else if(inst.foreign<-2000){tScore-=10;details.push({label:“外資大賣”,value:inst.foreign.toLocaleString(),color:C.r,pts:-10,mode:“trend”});}
}
if(inst&&inst.invest>200){tScore+=5;details.push({label:“投信買超”,value:`+${inst.invest}`,color:C.b,pts:5,mode:“trend”});}
let vScore=0;
if(wRSI!=null){
if(wRSI<30){vScore+=30;details.push({label:“週RSI超賣”,value:wRSI.toFixed(1),color:C.g,pts:30,mode:“value”});}
else if(wRSI<45){vScore+=20;details.push({label:“週RSI低檔”,value:wRSI.toFixed(1),color:C.g,pts:20,mode:“value”});}
else if(wRSI<55){vScore+=8;details.push({label:“週RSI中低”,value:wRSI.toFixed(1),color:C.g,pts:8,mode:“value”});}
}
if(lRSI!=null){
if(lRSI<30){vScore+=20;details.push({label:“RSI超賣”,value:lRSI.toFixed(1),color:C.g,pts:20,mode:“value”});}
else if(lRSI<40){vScore+=10;details.push({label:“RSI低檔”,value:lRSI.toFixed(1),color:C.g,pts:10,mode:“value”});}
}
if(lBB&&lBB.upper!==lBB.lower){
const bp=(price-lBB.lower)/(lBB.upper-lBB.lower)*100;
const bw=(lBB.upper-lBB.lower)/lBB.mid*100;
if(bp<15){vScore+=25;details.push({label:“觸及布林下軌”,value:`${bp.toFixed(0)}%`,color:C.g,pts:25,mode:“value”});}
else if(bp<30){vScore+=15;details.push({label:“近布林下軌”,value:`${bp.toFixed(0)}%`,color:C.g,pts:15,mode:“value”});}
if(bw<3){vScore+=10;details.push({label:“布林帶極度收窄”,value:“即將爆發”,color:C.ac,pts:10,mode:“value”});}
}
if(lKD?.k!=null){
if(lKD.k<20){vScore+=20;details.push({label:“KD超賣”,value:`K:${lKD.k.toFixed(0)}`,color:C.g,pts:20,mode:“value”});}
else if(lKD.k<35){vScore+=10;details.push({label:“KD低檔”,value:`K:${lKD.k.toFixed(0)}`,color:C.g,pts:10,mode:“value”});}
}
if(lBias!=null){
if(lBias<-12){vScore+=20;details.push({label:“嚴重超跌”,value:`乖離${lBias.toFixed(1)}%`,color:C.g,pts:20,mode:“value”});}
else if(lBias<-8){vScore+=12;details.push({label:“日線超跌”,value:`乖離${lBias.toFixed(1)}%`,color:C.g,pts:12,mode:“value”});}
}
if(divs.length>0&&divs[divs.length-1].type===“底背離”){vScore+=15;details.push({label:“底背離”,value:“量縮價穩”,color:C.g,pts:15,mode:“value”});}
if(mac.conflict){vScore+=8;details.push({label:“均線糾結”,value:`${mac.tightness}%`,color:C.ac,pts:8,mode:“value”});}
const tNorm=Math.max(0,Math.min(100,tScore));
const vNorm=Math.max(0,Math.min(100,vScore));
let mode,score;
if(tNorm>=vNorm){mode=“trend”;score=tNorm;}
else{mode=“value”;score=vNorm;}
return{score,trendScore:tNorm,valueScore:vNorm,mode,details};
}

// ── 前端直接打 TWSE 抓連續法人資料（近10個交易日）────────
async function fetchInstHistory(code) {
const results = [];
const dates = [];
const d = new Date();
// 收集最近15個日曆日，取出10個交易日
for (let i = 0; i < 20 && dates.length < 10; i++) {
d.setDate(d.getDate() - 1);
if (d.getDay() !== 0 && d.getDay() !== 6) {
dates.push(d.toISOString().slice(0,10).replace(/-/g,””));
}
}
// 只抓最近3天避免太慢
for (const dateStr of dates.slice(0, 3)) {
try {
const r = await fetch(
`https://www.twse.com.tw/rwd/zh/fund/T86?response=json&date=${dateStr}&selectType=ALLBUT`,
{ headers: { “User-Agent”: “Mozilla/5.0” } }
);
const j = await r.json();
const row = (j.data||[]).find(r => r[0] === code);
if (row) {
results.push({
date: dateStr,
foreign: parseInt((row[4]||“0”).replace(/,/g,””).replace(/+/g,””))||0,
invest:  parseInt((row[7]||“0”).replace(/,/g,””).replace(/+/g,””))||0,
dealer:  parseInt((row[10]||“0”).replace(/,/g,””).replace(/+/g,””))||0,
});
}
} catch(e) {}
await new Promise(r => setTimeout(r, 200));
}

if (results.length === 0) return null;

// 計算連買天數
let foreignConsec = 0, investConsec = 0;
for (const r of results) {
if (r.foreign > 0) foreignConsec++; else break;
}
for (const r of results) {
if (r.invest > 0) investConsec++; else break;
}

const latest = results[0] || {};
return {
foreign: latest.foreign || 0,
invest:  latest.invest  || 0,
dealer:  latest.dealer  || 0,
total:   (latest.foreign||0)+(latest.invest||0)+(latest.dealer||0),
foreignConsecDays: foreignConsec,  // 外資連買天數
investConsecDays:  investConsec,   // 投信連買天數
bothBuying: foreignConsec >= 2 && investConsec >= 2, // 雙法人連買
history: results,
};
}

// ── Canvas Hook ──
function useCanvas(fn,deps){
const ref=React.useRef(null);
React.useEffect(()=>{if(!ref.current)return;const c=ref.current,dpr=window.devicePixelRatio||1;const rect=c.getBoundingClientRect();if(!rect.width)return;c.width=rect.width*dpr;c.height=rect.height*dpr;const ctx=c.getContext(“2d”);ctx.scale(dpr,dpr);fn(ctx,rect.width,rect.height);},[…deps]);
return ref;
}

const xS=i=>pL+(i/(data.length-1))*cW,yS=p=>pT+cH-((p-mn)/(mx-mn))*cH,vS=v=>H-pB-(v/mv)*vH;

[[5,C.ac],[20,C.b],[60,C.p]].forEach(([period,col])=>{if(data.length<period)return;const ma=calcMA(data.map(d=>d.close),period);ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.globalAlpha=0.85;ctx.beginPath();let f=true;ma.forEach((v,i)=>{if(v===null)return;if(f){ctx.moveTo(xS(i),yS(v));f=false;}else ctx.lineTo(xS(i),yS(v));});ctx.stroke();ctx.globalAlpha=1;});
const bw=Math.max(3,cW/data.length-1.5);data.forEach((d,i)=>{const x=xS(i),up=d.close>=d.open;ctx.strokeStyle=up?C.g:C.r;ctx.fillStyle=up?C.g:C.r;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,yS(d.high));ctx.lineTo(x,yS(d.low));ctx.stroke();ctx.globalAlpha=up?0.9:0.8;ctx.fillRect(x-bw/2,yS(Math.max(d.open,d.close)),bw,Math.max(1.5,Math.abs(yS(d.open)-yS(d.close))));ctx.globalAlpha=1;ctx.fillStyle=up?C.g:C.r;ctx.globalAlpha=0.4;const top=vS(d.vol||0);ctx.fillRect(x-bw/2,top,bw,H-pB-top);ctx.globalAlpha=1;});

// ── 指標（回測用，接受純 array）──
function btSMA(prices,n){return prices.map((*,i)=>i<n-1?null:prices.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n);}
function btEMA(prices,n){const k=2/(n+1);const ema=[];prices.forEach((p,i)=>{ema.push(i===0?p:p*k+ema[i-1]*(1-k));});return ema;}
function btRSI(prices,n){
const rsi=Array(prices.length).fill(null);
for(let i=n;i<prices.length;i++){const sl=prices.slice(i-n,i+1);let g=0,l=0;for(let j=1;j<sl.length;j++){const d=sl[j]-sl[j-1];if(d>0)g+=d;else l-=d;}const ag=g/n,al=l/n;rsi[i]=al===0?100:100-100/(1+ag/al);}
return rsi;
}
function btMACD(prices,fast,slow,sig){
const ef=btEMA(prices,fast),es=btEMA(prices,slow);
const ml=ef.map((v,i)=>v-es[i]);
const sv=btEMA(ml,sig);
return{ml,signal:sv,hist:ml.map((v,i)=>v-sv[i])};
}
function btKD(bars,n){
let k=50,d=50;
return bars.map((*,i)=>{
if(i<n-1)return{k:null,d:null};
const sl=bars.slice(i-n+1,i+1);
const hi=Math.max(…sl.map(x=>x.high)),lo=Math.min(…sl.map(x=>x.low));
const rsv=hi===lo?50:(bars[i].close-lo)/(hi-lo)*100;
k=k*2/3+rsv/3;d=d*2/3+k/3;return{k,d};
});
}
function btBB(prices,n,std){
const sma=btSMA(prices,n);
return prices.map((_,i)=>{
if(i<n-1)return{mid:null,upper:null,lower:null};
const sl=prices.slice(i-n+1,i+1),mean=sma[i];
const s=Math.sqrt(sl.reduce((a,v)=>a+(v-mean)**2,0)/n);
return{mid:mean,upper:mean+std*s,lower:mean-std*s};
});
}

// ── 策略訊號 ──
function genSignals(bars,strat,p){
const closes=bars.map(b=>b.close);
const highs=bars.map(b=>b.high),lows=bars.map(b=>b.low);
const sma_s=btSMA(closes,p.maShort),sma_l=btSMA(closes,p.maLong);
const rsi=btRSI(closes,p.rsiPeriod);
const macdObj=btMACD(closes,p.macdFast,p.macdSlow,p.macdSig);
const kdArr=btKD(bars,p.kdPeriod);
const bbArr=btBB(closes,p.bbPeriod,p.bbStd);
const sig=Array(bars.length).fill(0);
for(let i=1;i<bars.length;i++){
if(strat===“ma_cross”){
if(sma_s[i]&&sma_l[i]&&sma_s[i-1]&&sma_l[i-1]){
if(sma_s[i-1]<=sma_l[i-1]&&sma_s[i]>sma_l[i])sig[i]=1;
if(sma_s[i-1]>=sma_l[i-1]&&sma_s[i]<sma_l[i])sig[i]=-1;
}
}else if(strat===“rsi”){
if(rsi[i]!=null&&rsi[i-1]!=null){
if(rsi[i-1]<=p.rsiOs&&rsi[i]>p.rsiOs)sig[i]=1;
if(rsi[i-1]>=p.rsiOb&&rsi[i]<p.rsiOb)sig[i]=-1;
}
}else if(strat===“macd”){
const m=macdObj.ml,s=macdObj.signal;
if(m[i]!=null&&s[i]!=null){
if(m[i-1]<=s[i-1]&&m[i]>s[i])sig[i]=1;
if(m[i-1]>=s[i-1]&&m[i]<s[i])sig[i]=-1;
}
}else if(strat===“kd”){
const K=kdArr,kv=d=>d.k,dv=d=>d.d;
if(K[i].k!=null){
if(K[i-1].k<=p.kdOs&&K[i-1].k<=K[i-1].d&&K[i].k>K[i].d)sig[i]=1;
if(K[i-1].k>=p.kdOb&&K[i-1].k>=K[i-1].d&&K[i].k<K[i].d)sig[i]=-1;
}
}else if(strat===“bband”){
if(bbArr[i].mid!=null&&bbArr[i-1].mid!=null){
if(closes[i-1]<=bbArr[i-1].lower&&closes[i]>bbArr[i].mid)sig[i]=1;
if(closes[i-1]>=bbArr[i-1].upper&&closes[i]<bbArr[i].mid)sig[i]=-1;
}
}
}
return sig;
}

// ── 模擬交易 ──
function simulate(bars,signals,initCap,investPct){
// ⚡ 訊號出現在第 i 根收盤 → 第 i+1 根「開盤價」成交（消除未來函數偏差）
const FEE_B=0.001425,FEE_S=0.001425+0.003,LOT=1000;
let cash=initCap;let pos=null;
const trades=[];const equity=[initCap];
for(let i=1;i<bars.length;i++){
// 用收盤價更新每日資產估值
const closePrice=bars[i].close;
// 前一根有訊號 → 今日開盤執行（次日開盤成交）
const execPrice=bars[i].open||closePrice; // 若無開盤價則 fallback 收盤
if(pos&&signals[i-1]===-1){
// 賣出：用今日開盤價
const gross=execPrice*pos.shares;const net=gross*(1-FEE_S);cash+=net;
const pnl=net-pos.cost;const pnlPct=pnl/pos.cost*100;
const hold=Math.round((new Date(bars[i].date)-new Date(pos.buyDate))/86400000);
trades.push({id:trades.length+1,buyDate:pos.buyDate,buyPrice:pos.buyPrice,sellDate:bars[i].date,sellPrice:execPrice,shares:pos.shares,cost:pos.cost,net,pnl,pnlPct,holdDays:hold,cumEquity:cash});
pos=null;
}
if(!pos&&signals[i-1]===1){
// 買入：用今日開盤價
const budget=cash*investPct;const lots=Math.floor(budget/(execPrice*LOT));
if(lots>0){const shares=lots*LOT;const cost=execPrice*shares*(1+FEE_B);cash-=cost;pos={buyDate:bars[i].date,buyPrice:execPrice,shares,cost};}
}
equity.push(cash+(pos?pos.shares*closePrice:0));
}
// 強制平倉用最後一根收盤
if(pos){
const last=bars[bars.length-1];const net=last.close*pos.shares*(1-FEE_S);cash+=net;
const pnl=net-pos.cost;const hold=Math.round((new Date(last.date)-new Date(pos.buyDate))/86400000);
trades.push({id:trades.length+1,buyDate:pos.buyDate,buyPrice:pos.buyPrice,sellDate:last.date,sellPrice:last.close,shares:pos.shares,cost:pos.cost,net,pnl,pnlPct:pnl/pos.cost*100,holdDays:hold,cumEquity:cash,forced:true});
}
return{trades,equity};
}

// ── 主回測 ──
async function run(){
if(!dateFrom||!dateTo){setError(“請選擇日期範圍”);return;}
if(new Date(dateFrom)>=new Date(dateTo)){setError(“起始日期必須早於結束日期”);return;}
setLoading(true);setError(””);setResult(null);
try{
const bars=await fetchBars(symbol.trim()||“2330”,dateFrom,dateTo);
if(bars.length<60)throw new Error(`資料不足（${bars.length}筆），請拉長回測區間`);
setLoadingText(“計算策略訊號…”);
const p={maShort,maLong,rsiPeriod,rsiOs,rsiOb,macdFast,macdSlow,macdSig,kdPeriod,kdOs,kdOb,bbPeriod,bbStd};
const signals=genSignals(bars,strategy,p);
const initCap=capital*10000;
const{trades,equity}=simulate(bars,signals,initCap,investPct/100);
// 統計
const final=equity[equity.length-1];
const totalRet=(final-initCap)/initCap*100;
const days=(new Date(bars[bars.length-1].date)-new Date(bars[0].date))/86400000;
const annualRet=(Math.pow(final/initCap,365/Math.max(days,1))-1)*100;
let peak=equity[0],maxDD=0;equity.forEach(v=>{if(v>peak)peak=v;maxDD=Math.max(maxDD,(peak-v)/peak);});
const wins=trades.filter(t=>t.pnl>0),losses=trades.filter(t=>t.pnl<=0);
const winrate=trades.length?wins.length/trades.length*100:0;
const tw=wins.reduce((s,t)=>s+t.pnl,0),tl=Math.abs(losses.reduce((s,t)=>s+t.pnl,0));
const pf=tl>0?tw/tl:(tw>0?Infinity:0);
const avgHold=trades.length?trades.reduce((s,t)=>s+t.holdDays,0)/trades.length:0;
const dr=equity.slice(1).map((v,i)=>(v-equity[i])/equity[i]);
const meanDR=dr.reduce((a,b)=>a+b,0)/Math.max(dr.length,1);
const stdDR=Math.sqrt(dr.reduce((s,r)=>s+(r-meanDR)**2,0)/Math.max(dr.length,1));
const sharpe=stdDR>0?(meanDR/stdDR*Math.sqrt(252)).toFixed(2):”—”;
const bh=equity.map((_,i)=>initCap*(bars[i].close/bars[0].close));
const monthly={};trades.forEach(t=>{const ym=t.sellDate.slice(0,7);monthly[ym]=(monthly[ym]||0)+t.pnl;});
setResult({bars,equity,bh,trades,wins,losses,totalRet,annualRet,maxDD:maxDD*100,winrate,pf,sharpe,avgHold,initCap,finalEquity:final,monthly,signals});
}catch(e){setError(e.message);}
finally{setLoading(false);}
}

function smartPick(stocks, limit=120) {
// 取漲幅前60 + 成交量前60，合併去重
const byChange = […stocks].sort((a,b)=>b.changePct-a.changePct).slice(0,60);
const byVolume = […stocks].sort((a,b)=>b.volume-a.volume).slice(0,60);
const seen = new Set();
const merged = [];
for (const s of […byChange,…byVolume]) {
if (!seen.has(s.code)) { seen.add(s.code); merged.push(s); }
if (merged.length >= limit) break;
}
return merged;
}
